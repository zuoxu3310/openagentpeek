[package]
name = "openagentpeek"
version = "0.1.0"
description = "Open-source menubar peek at every live Claude Code and Codex session"
authors = ["zuoxu"]
edition = "2021"

[lib]
name = "openagentpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Launch-at-login toggle, driven from set_settings (no JS plugin needed).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Menubar popover: turn the window into a non-activating NSPanel (openusage's approach).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
dirs = "6"
notify = "7"
log = "0.4"
tauri-plugin-log = "2"
# ISO-8601 parsing only: each JSONL record carries its own event timestamp, and the
# idle/waiting decay is measured from that, not from when we read the file.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSScreen", "NSGraphics"] }
